name: Compilar instaladores (Mac + Windows)

# Dispara al crear un tag vX.Y.Z (p.ej. git tag v0.1.0 && git push --tags),
# o manualmente desde la pestaña Actions. Compila cada instalador en su propio
# sistema operativo y los publica en la Release de ese tag. La landing
# (web/index.html) descarga desde /releases/latest/download.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npx electron-builder --mac --publish never
        working-directory: app
      - name: Publicar .dmg en la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/*.dmg
      - name: Guardar artefacto (si fue manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: app/dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npx electron-builder --win --publish never
        working-directory: app
      - name: Publicar .exe en la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/*.exe
      - name: Guardar artefacto (si fue manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/dist/*.exe
