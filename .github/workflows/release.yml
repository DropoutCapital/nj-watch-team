name: Compilar y publicar instaladores (Mac + Windows)

# Dispara al crear un tag vX.Y.Z (git tag v0.1.1 && git push origin v0.1.1)
# o manualmente. Compila cada instalador en su propio SO y lo PUBLICA en la
# Release del tag junto con latest.yml / latest-mac.yml (feed del auto-update).
# Requiere que las Releases sean accesibles públicamente para que:
#   - los botones de la landing descarguen, y
#   - electron-updater lea el feed de actualización.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npx electron-builder --mac --publish always
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: app
      - run: npx electron-builder --win --publish always
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
